[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-vggt-omega-reconstruction"
version = "0.1.0"
description = "Phone video to semantic, queryable 3D reconstruction using VGGT-Omega and SAM 3."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["spatial_recon*"]
